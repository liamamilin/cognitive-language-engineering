name: Build and publish CLE book

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cle-book-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Import sources only when repository has no docs
        if: github.event_name != 'pull_request' && hashFiles('docs/index.md') == ''
        run: |
          python - <<'PYIMPORT'
          from pathlib import Path
          import zipfile
          root = Path('.').resolve()
          prefix = 'cognitive-language-engineering/'
          with zipfile.ZipFile('source-import.zip') as archive:
              import hashlib, json
              manifest = json.loads(archive.read(prefix + 'release-manifest.json'))
              for name, expected in manifest['files'].items():
                  if hashlib.sha256(archive.read(prefix + name)).hexdigest() != expected:
                      raise ValueError('Source checksum mismatch: ' + name)
              for member in archive.infolist():
                  if member.is_dir() or not member.filename.startswith(prefix):
                      continue
                  relative = Path(member.filename[len(prefix):])
                  if relative.parts[0] == '.github':
                      continue
                  destination = (root / relative).resolve()
                  if not destination.is_relative_to(root):
                      raise ValueError('Invalid archive path')
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(archive.read(member))
          PYIMPORT
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs scripts overrides archive README.md AGENTS.md BUILD_REPORT.md baseline-manifest.json release-manifest.json mkdocs.yml requirements.txt .gitignore
          git commit -m 'Import frozen CLE v0.5 and structural core v0.2 sources'
          git push origin HEAD:main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/check_docs.py
      - run: python scripts/check_essentials.py
      - run: python -m mkdocs build --strict
      - run: python scripts/check_site.py
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4

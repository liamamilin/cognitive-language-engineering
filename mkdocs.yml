site_url: https://liamamilin.github.io/cognitive-language-engineering/
repo_url: https://github.com/liamamilin/cognitive-language-engineering
site_name: 认知语言工程
site_description: 让语言更有效地服务于思考、表达、协作与行动
docs_dir: docs
site_dir: site
use_directory_urls: true
theme:
  name: material
  custom_dir: overrides
  language: zh
  font: false
  features:
  - navigation.sections
  - navigation.footer
  - navigation.top
  - search.suggest
  - search.highlight
  - content.code.copy
  palette:
  - scheme: default
    primary: indigo
    accent: teal
    toggle:
      icon: material/weather-night
      name: 切换深色模式
  - scheme: slate
    primary: indigo
    accent: teal
    toggle:
      icon: material/weather-sunny
      name: 切换浅色模式
plugins:
- search:
    lang: zh
markdown_extensions:
- admonition
- tables
- fenced_code
- attr_list
- md_in_html
- toc:
    permalink: true
- pymdownx.superfences
- pymdownx.details
nav:
- 开始阅读: index.md
- 结构核心版: essentials/index.md
- 核心筛选审计: essentials/SELECTION.md
- 使用指南: START_HERE.md
- 五个心智模型: MENTAL_MODELS.md
- 核心体系:
  - 核心目的: PURPOSE.md
  - 核心规范 v0.5: CORE_SPEC.md
  - 状态与变化: STATE_SPEC.md
  - 术语表: GLOSSARY.md
- 四模型:
  - M1 表征: models/M1.md
  - M2 个体认知: models/M2.md
  - M3 共享与互动: models/M3.md
  - M4 语言行动: models/M4.md
- 连接与解释:
  - 跨模型连接: BRIDGES.md
  - 现实结果与反馈: OUTCOMES.md
  - 机制家族: MECHANISMS.md
- 语言工程:
  - 使用规格与演练: engineering/RUN_SPEC.md
  - 组件规格: engineering/COMPONENT_SPEC.md
  - 算子: engineering/OPERATORS.md
  - 语言模式: engineering/PATTERNS.md
  - 任务协议: engineering/PROTOCOLS.md
- 应用与评估:
  - 能力训练: learning/TRAINING.md
  - 完整案例: applications/CASES.md
  - 评估规范: evaluation/EVALUATION.md
  - 边界案例: evaluation/BOUNDARY_CASES.md
  - 证据规范: EVIDENCE_SPEC.md
  - 失效诊断: evaluation/FAILURE_ANALYSIS.md
- 来源:
  - 来源管理: sources/index.md
  - 核验文献: sources/VERIFIED_SOURCES.md
  - 旧引文审计: sources/conversation-citations.md
- 项目维护:
  - 当前状态: project/STATUS.md
  - 整合审查: project/REVIEW_REPORT.md
  - 基线追溯: project/BASELINE.md
  - 维护约定: project/MAINTENANCE.md
  - 变更记录: project/CHANGELOG.md
  - 在线发布: project/PUBLISHING.md
- 决策记录:
  - 001 文档与电子书: decisions/001-document-and-book.md
  - 002 模型与边界: decisions/002-model-and-state-boundaries.md
  - 003 工程与证据: decisions/003-engineering-and-evidence.md
  - 004 观察与使用闭环: decisions/004-observation-and-use.md
  - 005 少而实用的核心: decisions/005-practical-core.md
  - 006 保留结构的核心选择: decisions/006-structural-core.md
  - 007 冻结结构核心: decisions/007-freeze-structural-core.md
